name: Release

on:
  push:
    branches:
      - release-test # release-test 브랜치로 push/merge될 때 트리거
    paths:
      - 'frontend/**'
      - '.github/workflows/release.yml'

  pull_request: # <-- PR이 열리거나 업데이트될 때 트리거
    branches:
      - release-test # release-test 브랜치를 대상으로 하는 PR
    paths:
      - 'frontend/**'
      - '.github/workflows/release.yml'
jobs:
  Vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci # package-lock.json 기반으로 설치 (CI 환경에 권장)
        working-directory: ./frontend # frontend 디렉토리에서 실행

      - name: Run semantic-release
        # 릴리스는 push 이벤트 (PR 머지) 시에만 실행되도록 조건부 설정
        if: github.event_name == 'push' && github.ref == 'refs/heads/release-test'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # GitHub Actions Secrets에서 토큰 사용
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # npm 배포 시 필요한 경우 주석 해제
        run: npm run release
